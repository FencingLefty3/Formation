<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    
    <link rel="icon" href="formationLogo.png"/>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <main id="header">
    <div class="tempBox" id="tempBox">
        <p id="location"></p>
        <h2 id="currentTemp">--°</h2>
        <span id="flagBG" class="flagLayer"></span>
        <p id="conditions"></p>
    </div>
    </main>
    <main id="content">
        <div class="hourlyBox" id="hourlyBox">

        </div>
        <div class="forcastBox" id="forcastBox">

        </div>
        <div class="compoundBox" id="compoundBox" hidden>

        </div>    
        <div class="compoundBox" id="engineerBox" hidden>

        </div>
        <footer>
            US weather info via&nbsp;<a href="https://weather.gov">weather.gov</a>&nbsp;| Installable as PWA
        </footer>
    </main>
    <dialog id="alertDialog">

    </dialog>
    <dialog id="noLocation">
        <img src="icons/noLocation.svg" style="width: 8rem; height: 8rem;"><p>No Location Data</p><a href="" onclick="window.location.reload(); return false;">Refresh</a>
    </dialog>
    <button id="map"><img src="icons/map.svg"></button>
</body>
  <script type="module" src="index.js"></script>
</html>
